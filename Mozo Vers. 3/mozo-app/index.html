<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozo — Reservá, pedí y sentate a comer</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .hero-top {
    padding: 56px 24px 40px;
    text-align: center;
  }
  .hero-top h1 {
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    color: var(--navy);
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .hero-top h1 span { color: var(--coral); }
  .brand-message {
    max-width: 620px;
    margin: 18px auto 0;
  }
  .brand-message-line {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--font-display);
    font-size: clamp(1.35rem, 3vw, 2rem);
    font-weight: 600;
    color: var(--navy);
  }
  .brand-message-line span:nth-child(1) { color: var(--coral-dark); }
  .brand-message-line span:nth-child(2) { color: var(--navy); }
  .brand-message-line span:nth-child(3) { color: var(--gold-dark); }
  .brand-message-line span:not(:last-child)::after {
    content: "·";
    margin-left: 12px;
    color: var(--line);
  }
  .role-split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    min-height: 420px;
  }
  .role-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 72px 48px;
    overflow: hidden;
  }
  .role-panel.client { background: var(--coral); color: var(--white); }
  .role-panel::after {
    content: '';
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    right: -140px; bottom: -160px;
  }
  .role-panel .role-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 12px;
  }
  .role-panel h2 {
    font-size: clamp(3.2rem, 7vw, 5.2rem);
    margin-bottom: 24px;
    line-height: 1;
  }
  .role-panel p {
    max-width: 420px;
    opacity: 0.92;
    margin-bottom: 32px;
    font-size: 1.05rem;
  }
  .role-panel .role-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    padding: 16px 32px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.05rem;
    position: relative;
    z-index: 2;
  }
  .role-panel.client .role-cta { color: var(--coral-dark); }
  .role-panel .role-cta:hover { transform: translateX(3px); }
  .role-panel ul {
    list-style: none;
    padding: 0;
    margin: 0 0 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
  }
  .role-panel li {
    font-size: clamp(1.08rem, 2vw, 1.3rem);
    opacity: 0.95;
    padding-left: 22px;
    position: relative;
    line-height: 1.4;
  }
  .role-panel li::before {
    content: '';
    position: absolute;
    left: 0; top: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .foot-note {
    text-align: center;
    padding: 22px;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  @media (max-width: 780px) {
    .role-panel { padding: 48px 28px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <h1>Mozo<span>.</span></h1>

    <div class="brand-message" aria-label="Presentación de Mozo">
      <div class="brand-message-line">
        <span>Reservá.</span>
        <span>Pedí.</span>
        <span>Sentate.</span>
      </div>
    </div>
  </div>

  <div class="role-split">
    <a href="cliente.html" class="role-panel client">
      <h2>Soy cliente</h2>
      <ul>
        <li>Explorar locales recomendados</li>
        <li>Reservar mesa o pedir para llevar</li>
        <li>Ver el estado del pedido en vivo</li>
      </ul>
      <span class="role-cta">Entrar →</span>
    </a>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
