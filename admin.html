<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozo — Panel Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--cream); }
  .page-hero {
    background: var(--navy);
    color: var(--white);
    padding: 32px 0 40px;
  }
  .page-hero .eyebrow { color: var(--gold); }
  .page-hero-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
  }
  .page-hero h1 { font-size: clamp(1.7rem, 3.6vw, 2.3rem); margin: 6px 0 4px; }
  .page-hero p { color: #C7CFEF; font-size: 0.92rem; }
  .stat-row { display: flex; gap: 28px; }
  .stat { text-align: right; }
  .stat .num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--gold); }
  .stat .lbl { font-size: 0.72rem; color: #C7CFEF; text-transform: uppercase; letter-spacing: 0.06em; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin: -14px 0 40px;
  }
  .board-col {
    background: rgba(255,255,255,0.5);
    border-radius: var(--radius-md);
    padding: 16px;
    min-height: 200px;
  }
  .board-col h3 {
    font-size: 0.95rem;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .board-col h3 .count {
    background: var(--navy);
    color: var(--white);
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 999px;
    font-family: var(--font-mono);
  }
  .board-col.new h3 .count { background: var(--coral); }
  .board-col.prep h3 .count { background: var(--warn); }
  .board-col.ready h3 .count { background: var(--success); }

  .order-ticket {
    padding: 16px 18px 14px;
    margin-bottom: 14px;
  }
  .order-ticket-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .order-num { font-family: var(--font-mono); font-weight: 700; color: var(--navy); font-size: 0.95rem; }
  .order-time { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); }
  .order-items { list-style: none; padding: 0; margin: 10px 0; }
  .order-items li {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; padding: 3px 0; color: var(--ink);
  }
  .order-items li .qty { font-family: var(--font-mono); font-weight: 700; color: var(--coral-dark); margin-right: 6px; }
  .order-ticket-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .order-ticket .btn { width: 100%; margin-top: 10px; }

  .side-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
    margin-bottom: 50px;
  }
  .panel-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .panel-card h3 { font-size: 1.05rem; color: var(--navy); margin-bottom: 16px; }

  .table-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .table-row:last-child { border-bottom: none; }
  .table-name { font-weight: 600; }
  .table-status {
    font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  }
  .table-status.free { background: #DCF3E6; color: var(--success); }
  .table-status.reserved { background: #E4E7F7; color: var(--navy); }
  .table-status.occupied { background: #FDE4E5; color: var(--coral-dark); }

  .menu-edit-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem;
  }
  .menu-edit-row:last-child { border-bottom: none; }
  .menu-edit-row .price { font-family: var(--font-mono); color: var(--ink-soft); }

  @media (max-width: 980px) {
    .board { grid-template-columns: 1fr; }
    .side-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand">Mozo<span class="dot">.</span></a>
    <div class="nav-right">
      <span class="role-badge admin">Admin</span>
      <a href="cliente.html" class="switch-role">Ver portal cliente</a>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <div class="page-hero-row">
      <div>
        <div class="eyebrow">LA PARRILLA DEL BARRIO</div>
        <h1>Comandas de hoy</h1>
        <p>Se actualiza en tiempo real apenas un cliente confirma su pedido.</p>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="statNew">0</div><div class="lbl">Nuevas</div></div>
        <div class="stat"><div class="num" id="statPrep">0</div><div class="lbl">En cocina</div></div>
        <div class="stat"><div class="num" id="statReady">0</div><div class="lbl">Listas</div></div>
      </div>
    </div>
  </div>
</header>

<main class="container" style="padding-top: 30px;">

  <div class="board" id="board">
    <div class="board-col new">
      <h3>Nuevas comandas <span class="count" id="countNew">0</span></h3>
      <div id="colNew"></div>
    </div>
    <div class="board-col prep">
      <h3>En preparación <span class="count" id="countPrep">0</span></h3>
      <div id="colPrep"></div>
    </div>
    <div class="board-col ready">
      <h3>Listas <span class="count" id="countReady">0</span></h3>
      <div id="colReady"></div>
    </div>
  </div>

  <div class="side-grid">
    <div class="panel-card">
      <h3>Mesas y reservas</h3>
      <div id="tableList"></div>
    </div>
    <div class="panel-card">
      <h3>Menú del local</h3>
      <div id="menuEditList"></div>
      <button class="btn btn-ghost btn-sm btn-block" style="margin-top: 14px;">+ Agregar plato</button>
    </div>
  </div>
</main>

<div class="toast" id="toast">Comanda actualizada ✓</div>

<script src="js/main.js"></script>
</body>
</html>
